<svg viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="kb-thruster-core" x1="256" y1="40" x2="256" y2="460" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="15%" stop-color="#FFDD00" />
      <stop offset="45%" stop-color="#FF6600" />
      <stop offset="100%" stop-color="#D90429" />
    </linearGradient>

    <linearGradient id="kb-wing-left" x1="90" y1="60" x2="232" y2="430" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="50%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>

    <linearGradient id="kb-wing-right" x1="422" y1="60" x2="280" y2="430" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#283548" />
      <stop offset="50%" stop-color="#172033" />
      <stop offset="100%" stop-color="#0B1120" />
    </linearGradient>

    <filter id="kb-plasma-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Left Creator Wing (Engineering / Syntax) -->
  <polygon points="232,60 90,390 150,430 232,220" fill="url(#kb-wing-left)" stroke="#475569" stroke-width="4" stroke-linejoin="round" />

  <!-- Right Creator Wing (Design / Product) -->
  <polygon points="280,60 422,390 362,430 280,220" fill="url(#kb-wing-right)" stroke="#475569" stroke-width="4" stroke-linejoin="round" />

  <!-- Outer Ambient Plasma Bloom -->
  <polygon points="256,40 278,175 256,460 234,175" fill="url(#kb-thruster-core)" filter="url(#kb-plasma-glow)" opacity="0.6" />

  <!-- High-Velocity Supersonic Plasma Thrust Vector -->
  <polygon points="256,40 274,175 256,460 238,175" fill="url(#kb-thruster-core)" />

  <!-- White-Hot Supernova Ignition Core -->
  <polygon points="256,55 264,155 256,360 248,155" fill="#FFFFFF" />
</svg>
