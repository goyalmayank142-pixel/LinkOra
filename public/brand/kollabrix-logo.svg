<svg viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient: Deep Obsidian Squircle -->
    <linearGradient id="kb-bg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0F121C"/>
      <stop offset="100%" stop-color="#07080D"/>
    </linearGradient>

    <!-- Supersonic Plasma Thruster Core -->
    <linearGradient id="kb-core-flame" x1="256" y1="40" x2="256" y2="470" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="12%" stop-color="#FFE066"/>
      <stop offset="35%" stop-color="#FF7A00"/>
      <stop offset="80%" stop-color="#EA580C"/>
      <stop offset="100%" stop-color="#C2410C"/>
    </linearGradient>

    <!-- Left Wing (Titanium Highlight) -->
    <linearGradient id="kb-wing-l" x1="100" y1="70" x2="232" y2="430" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3A465C"/>
      <stop offset="40%" stop-color="#1E2638"/>
      <stop offset="100%" stop-color="#0E121B"/>
    </linearGradient>

    <!-- Right Wing (Deep Shadow) -->
    <linearGradient id="kb-wing-r" x1="412" y1="70" x2="280" y2="430" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2D374A"/>
      <stop offset="40%" stop-color="#161D2B"/>
      <stop offset="100%" stop-color="#0A0D14"/>
    </linearGradient>

    <!-- Ambient Thruster Radiance Bloom -->
    <radialGradient id="kb-ambient-glow" cx="256" cy="240" r="180" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FF7A00" stop-opacity="0.45"/>
      <stop offset="50%" stop-color="#FF5500" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#FF4400" stop-opacity="0"/>
    </radialGradient>

    <filter id="kb-plasma-bloom" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Ambient Radiant Core Glow -->
  <circle cx="256" cy="240" r="160" fill="url(#kb-ambient-glow)"/>

  <!-- Left Creator Wing (Engineering / Code) -->
  <polygon points="230,76 104,386 164,424 230,230" fill="url(#kb-wing-l)" stroke="#4A5874" stroke-width="5" stroke-linejoin="round"/>

  <!-- Right Creator Wing (Product / Design) -->
  <polygon points="282,76 408,386 348,424 282,230" fill="url(#kb-wing-r)" stroke="#4A5874" stroke-width="5" stroke-linejoin="round"/>

  <!-- Supersonic Plasma Thruster Flame (Full Beam) -->
  <polygon points="256,48 276,180 256,458 236,180" fill="url(#kb-core-flame)" filter="url(#kb-plasma-bloom)"/>
  <polygon points="256,48 274,180 256,458 238,180" fill="url(#kb-core-flame)"/>

  <!-- Incandescent White-Hot Fusion Spike -->
  <polygon points="256,62 265,160 256,360 247,160" fill="#FFFFFF"/>
</svg>