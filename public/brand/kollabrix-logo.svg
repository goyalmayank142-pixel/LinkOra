<svg width="120" height="120" viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Dark Carbon Slate Gradient -->
    <linearGradient id="kb-bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1C1917" />
      <stop offset="50%" stop-color="#141210" />
      <stop offset="100%" stop-color="#090807" />
    </linearGradient>

    <!-- Golden Amber Pillar Gradients -->
    <linearGradient id="kb-gold-top" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A" />
      <stop offset="100%" stop-color="#FACC15" />
    </linearGradient>
    <linearGradient id="kb-amber-front" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="60%" stop-color="#EA580C" />
      <stop offset="100%" stop-color="#C2410C" />
    </linearGradient>
    <linearGradient id="kb-amber-side" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#B45309" />
      <stop offset="100%" stop-color="#78350F" />
    </linearGradient>

    <!-- Upper Arm (Amber Top, Cyan Front) Gradients -->
    <linearGradient id="kb-arm-top-face" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="70%" stop-color="#7DD3FC" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>
    <linearGradient id="kb-arm-top-front" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="60%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#0369A1" />
    </linearGradient>

    <!-- Lower Leg (Electric Cyan / Turquoise) Gradients -->
    <linearGradient id="kb-cyan-top" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A5F3FC" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>
    <linearGradient id="kb-cyan-front" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#22D3EE" />
      <stop offset="50%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#0891B2" />
    </linearGradient>
    <linearGradient id="kb-cyan-side" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0E7490" />
      <stop offset="100%" stop-color="#155E75" />
    </linearGradient>

    <!-- Ambient Glow Filter -->
    <filter id="kb-neon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle Base Frame -->
  <rect width="120" height="120" rx="30" fill="url(#kb-bg-grad)" stroke="#2E2822" stroke-width="2" />
  
  <!-- Subtle Internal Architectural Grid Lines -->
  <path d="M20 60H100" stroke="#2E2822" stroke-width="1" stroke-dasharray="3 3" stroke-opacity="0.5" />
  <path d="M60 20V100" stroke="#2E2822" stroke-width="1" stroke-dasharray="3 3" stroke-opacity="0.5" />

  <!-- 3D ISOMETRIC KOLLABRIX "K" -->
  <g transform="translate(4, 0)">
    <!-- 1. LEFT VERTICAL TOWER (Modular Golden Amber Brix Column) -->
    <!-- Front Face -->
    <rect x="26" y="28" width="16" height="64" rx="2" fill="url(#kb-amber-front)" />
    <!-- Voxel Brix Seam Lines on Front Face -->
    <line x1="26" y1="44" x2="42" y2="44" stroke="#78350F" stroke-width="1" stroke-opacity="0.6" />
    <line x1="26" y1="60" x2="42" y2="60" stroke="#78350F" stroke-width="1" stroke-opacity="0.6" />
    <line x1="26" y1="76" x2="42" y2="76" stroke="#78350F" stroke-width="1" stroke-opacity="0.6" />
    <!-- Top Face (Isometric Cap) -->
    <polygon points="26,28 36,18 52,18 42,28" fill="url(#kb-gold-top)" />
    <!-- Side Isometric Thickness Face (Shaded) -->
    <polygon points="42,28 52,18 52,82 42,92" fill="url(#kb-amber-side)" />

    <!-- 2. UPPER DIAGONAL ARM (Ascending Innovation Vector) -->
    <!-- Side Extrusion / Bottom -->
    <polygon points="42,54 78,22 88,28 52,66" fill="#0369A1" />
    <!-- Front Isometric Face -->
    <polygon points="42,54 78,22 88,32 52,66" fill="url(#kb-arm-top-front)" />
    <!-- Top Isometric Face -->
    <polygon points="42,46 52,38 88,18 78,22" fill="url(#kb-arm-top-face)" />
    <!-- Grid Brix Seams on Upper Arm -->
    <line x1="56" y1="41" x2="63" y2="47" stroke="#0C4A6E" stroke-width="1" stroke-opacity="0.5" />
    <line x1="68" y1="31" x2="75" y2="37" stroke="#0C4A6E" stroke-width="1" stroke-opacity="0.5" />

    <!-- 3. LOWER DIAGONAL LEG (Electric Cyan High-Tech Brix) -->
    <!-- Top Isometric Face -->
    <polygon points="42,66 52,58 84,88 74,96" fill="url(#kb-cyan-top)" />
    <!-- Front Face -->
    <polygon points="42,66 74,96 68,102 36,72" fill="url(#kb-cyan-front)" filter="url(#kb-neon-glow)" />
    <!-- Side Isometric Thickness Face -->
    <polygon points="74,96 84,88 78,94 68,102" fill="url(#kb-cyan-side)" />
    <!-- Grid Brix Seams on Lower Leg -->
    <line x1="51" y1="75" x2="59" y2="83" stroke="#164E63" stroke-width="1" stroke-opacity="0.6" />
    <line x1="61" y1="84" x2="69" y2="92" stroke="#164E63" stroke-width="1" stroke-opacity="0.6" />

    <!-- 4. CENTRAL INTERLOCKING NEXUS SPARK (The Bridge Core) -->
    <polygon points="38,58 46,50 54,58 46,66" fill="#FFFFFF" opacity="0.95" />
  </g>
</svg>
