<svg width="48" height="48" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Glow & Gradient -->
    <linearGradient id="kb-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181512" />
      <stop offset="100%" stop-color="#0C0A09" />
    </linearGradient>
    <!-- Vertical Pillar Gradient (Warm Amber / Gold) -->
    <linearGradient id="kb-stem" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <!-- Upper Diagonal Arm (Vibrant Cyan / Hackathon Energy) -->
    <linearGradient id="kb-arm-top" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
    <!-- Lower Diagonal Leg (Emerald / Growth / Collegiate Victory) -->
    <linearGradient id="kb-arm-bottom" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <!-- Intersection Spark / Nexus Prism -->
    <linearGradient id="kb-nexus" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
    <filter id="kb-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle Base Frame -->
  <rect width="48" height="48" rx="14" fill="url(#kb-bg)" stroke="#292524" stroke-width="1.5" />
  
  <!-- Subtle Grid lines evoking building blocks (Brix) -->
  <path d="M12 24H36" stroke="#292524" stroke-width="0.75" stroke-dasharray="2 2" stroke-opacity="0.4" />
  <path d="M24 12V36" stroke="#292524" stroke-width="0.75" stroke-dasharray="2 2" stroke-opacity="0.4" />

  <!-- The "K" Left Vertical Pillar (Modular 2-Segment Blocks) -->
  <rect x="10" y="10" width="7" height="13" rx="3.5" fill="url(#kb-stem)" />
  <rect x="10" y="25" width="7" height="13" rx="3.5" fill="url(#kb-stem)" />

  <!-- The "K" Upper Diagonal Block Arm (Cyan/Sky) -->
  <path d="M20 22L29.5 12.5C30.6 11.4 32.5 12.2 32.5 13.8V17C32.5 17.8 32.1 18.6 31.5 19.2L24.5 25L20 22Z" fill="url(#kb-arm-top)" filter="url(#kb-glow)" />

  <!-- The "K" Lower Diagonal Block Arm (Emerald/Teal) -->
  <path d="M20 26L25 23L31.8 30.5C32.4 31.2 32.5 32.1 32.2 32.9L31.2 35.2C30.7 36.4 29.1 36.8 28.1 35.8L20 26Z" fill="url(#kb-arm-bottom)" />

  <!-- Nexus Synergy Prism / Diamond Core (Collaboration Point) -->
  <rect x="17.5" y="21.5" width="5" height="5" rx="1.5" transform="rotate(45 20 24)" fill="url(#kb-nexus)" />
</svg>
